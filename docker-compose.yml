services:
  redis:
    image: redis:7-alpine
    container_name: synthetix_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./ai-service
    container_name: synthetix_ai
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    volumes:
      - ai_chroma_data:/app/chroma_db

  backend:
    build: ./backend
    container_name: synthetix_backend
    command: >
      sh -c "python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            uvicorn synthetix_os.asgi:application --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai-service:8001
    restart: always
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_db

  celery-worker:
    build: ./backend
    container_name: synthetix_celery
    command: celery -A synthetix_os worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai-service:8001
    restart: always
    volumes:
      - ./backend:/app

  celery-beat:
    build: ./backend
    command: celery -A synthetix_os beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai-service:8001
    restart: always
    volumes:
      - ./backend:/app

volumes:
  chroma_data:
  ai_chroma_data:
